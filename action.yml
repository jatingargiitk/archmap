name: 'archmap'
description: 'Snapshot tests for your architecture - track module dependencies'
author: 'Jatin Garg'

branding:
  icon: 'map'
  color: 'blue'

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        npm ci --omit=dev
    
    - name: Run archmap
      shell: bash
      run: node ${{ github.action_path }}/dist/action.js
      env:
        INPUT_MODE: ${{ inputs.mode }}
        GITHUB_TOKEN: ${{ inputs.github-token }}

inputs:
  mode:
    description: 'Mode: comment (default) or gate'
    required: false
    default: 'comment'
  github-token:
    description: 'GitHub token for posting comments'
    required: false
    default: ${{ github.token }}
